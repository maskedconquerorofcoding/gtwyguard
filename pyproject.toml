[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtwyguard"
version = "0.1.0"
description = "Download & Source Code Prompt Injection Gatekeeper"
authors = [{ name = "Jedidiah Roberts" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "watchdog>=3.0.0",
    "rich>=12.0.0"
]

[project.scripts]
gtwyguard = "gtwyguard.cli:main"
